<title id="t">Where the fine-tuned model loses or wins only a little</title>
<desc id="d">Task category from the title (accuracy): fine-tuned 0.729, label already written by hand 0.812. Key sentences in real notes (F1): base 0.088, fine-tuned 0.444, keyword list 0.223. Real log lines, relevant or noise (accuracy): base 0.288, fine-tuned 0.915, "everything is noise" 0.725.</desc>
