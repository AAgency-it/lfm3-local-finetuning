<text x="129" y="362" font-size="18" class="s" text-anchor="middle">20</text>
<line x1="217.1" y1="324" x2="217.1" y2="336" stroke="#D0D7DE" stroke-width="2"/>
<text x="217" y="362" font-size="18" class="s" text-anchor="middle">40</text>
<line x1="305.7" y1="324" x2="305.7" y2="336" stroke="#D0D7DE" stroke-width="2"/>
<text x="306" y="362" font-size="18" class="s" text-anchor="middle">60</text>
<line x1="394.3" y1="324" x2="394.3" y2="336" stroke="#D0D7DE" stroke-width="2"/>
<text x="394" y="362" font-size="18" class="s" text-anchor="middle">80</text>
<line x1="482.9" y1="324" x2="482.9" y2="336" stroke="#D0D7DE" stroke-width="2"/>
<text x="483" y="362" font-size="18" class="s" text-anchor="middle">100</text>
