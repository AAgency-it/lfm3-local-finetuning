<svg xmlns="http://www.w3.org/2000/svg" width="720" height="464" viewBox="0 0 720 464" role="img" aria-labelledby="t d">
<title id="t">GPU memory and speed of the base model on a GTX 1660 Ti</title>
<desc id="d">The server takes 1401 MiB of the 6144 MiB card. Generation speed in three separate starts: 118.1, 100.6, 123.4 tokens per second. The fine-tuned Q8_0 models were not measured here.</desc>
<style>text { font-family: -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #1F2328; } .s { fill: #59636E; } .m { font-family: ui-monospace, &quot;Cascadia Mono&quot;, Consolas, Menlo, monospace; }</style>
<rect x="0.5" y="0.5" width="719" height="463" rx="14" fill="#FCFCFA" stroke="#D0D7DE"/>
<text x="40" y="52" font-size="30" font-weight="700">One gaming card is enough to run it</text>
<text x="40" y="84" font-size="20" class="s">GTX 1660 Ti, base LFM3 1.7B (Q4_K_M), measured 2026-11-03.</text>
<text x="40" y="136" font-size="21" font-weight="600">GPU memory taken by the server</text>
<rect x="40" y="152" width="640" height="30" rx="4" fill="#E4E7EB"/>
<rect x="40" y="152" width="146" height="30" rx="4" fill="#2a78d6"/>
<text x="40" y="212" font-size="20" font-weight="600">1,401 MiB of 6,144 MiB (23%)</text>
<text x="40" y="270" font-size="21" font-weight="600">Generation speed, three separate starts</text>
